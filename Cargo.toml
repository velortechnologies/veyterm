[package]
name = "veyterm"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
ed25519-dalek = "3.0.0"
mime_guess = "2.0.5"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "std", "unstable-rendered-line-info"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tungstenite = { version = "0.30.0", features = ["handshake"], default-features = false }
unicode-width = "0.2.3"
url = "2.5.8"
webpki-roots = "1.0.12"
